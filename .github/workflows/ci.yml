# Type-check, run the unit tests, then build the package and the demo hosts
# that emulate mckoss.com, and run the end-to-end tests against them. On
# main, when that passes:
# - release: attach the package tarball to the GitHub Release
#   v<package.json version> (mckoss.com installs it by that URL), unless
#   that version is released already. Pull requests must bump the version
#   (.github/scripts/version-is-new.mjs), so every merge is released.
# - deploy: the demo hosts and examples to GitHub Pages,
#   mckoss.com/logo-library/ (built with SITE_BASE=/logo-library/, see
#   demo/build-hosts.mjs).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # (On main every run releases its own version, so none is cancelled.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: github.event_name == 'pull_request'
        name: The version is new (each merge to main is released)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --depth=1 origin main
          node .github/scripts/version-is-new.mjs
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build and end-to-end tests
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/site/logo-library
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        name: Pack
        run: npm pack
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: mckoss-logo-library-*.tgz
          retention-days: 7

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
      - name: Release this version, unless it's released already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is released already; nothing to do."
            exit 0
          fi
          gh release create "$TAG" mckoss-logo-library-*.tgz --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
